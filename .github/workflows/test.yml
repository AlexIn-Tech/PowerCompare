name: PowerShell validation
on:
  workflow_dispatch:
    inputs:
      shell:
        description: PowerShell runtime to validate
        type: choice
        options:
          - pwsh
          - powershell
        default: pwsh
        required: true
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ inputs.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test dependencies
        run: ./scripts/Install-DevDependencies.ps1
      - name: Pester tests and coverage
        run: ./scripts/Test.ps1 -Coverage
      - name: Static analysis
        run: |
          $issues = @(Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Error)
          $issues | Format-Table -AutoSize
          if ($issues.Count) { throw 'Static analysis errors' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.shell }}
          path: TestResults/
